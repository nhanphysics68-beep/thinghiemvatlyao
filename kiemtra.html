  <link rel="stylesheet" href="css/style.css">

    .qcard.ok { border-color: var(--ok); } .qcard.bad { border-color: var(--bad); } .qcard.part { border-color: #b7791f; }
    .qhead { font-weight: 700; margin-bottom: 6px; }
    .qtext img, .opt img { max-width: 100%; height: auto; }
    .qtext p { margin: 0 0 6px; }
    .qtext table { width: auto; margin: 6px 0; } .qtext td, .qtext th { text-align: left; border: 1px solid var(--line); }
    .opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; cursor: pointer; min-height: 44px; }

    .subrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }

    textarea.rules { width: 100%; min-height: 160px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--card); color: var(--ink); }
    details { margin: 10px 0; } summary { cursor: pointer; font-weight: 600; min-height: 36px; }
    pre.tpl { background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; overflow: auto; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }

<script type="module">
/* =====================================================================
   KIỂM TRA TRỰC TUYẾN
   - Học sinh: nhập họ tên, lớp, mã đề → làm bài → xem kết quả ngay.
   - Giáo viên: tải đề (Word mẫu) + đáp án (Word hoặc Excel) → đăng đề → xem bảng điểm.
   - Dữ liệu lưu ở Firebase Firestore (cùng dự án với web quản lý thiết bị).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDZzLXwtVC7-HM-_ayrsdScMcPw15xSuAA", authDomain: "thietbi-8fe39.firebaseapp.com", projectId: "thietbi-8fe39",
  storageBucket: "thietbi-8fe39.firebasestorage.app", messagingSenderId: "1074857754109", appId: "1:1074857754109:web:7550c9f5ae6180c7e46d94"
};
const FB = (m) => `https://www.gstatic.com/firebasejs/10.12.2/firebase-${m}.js`;
const LIB_MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
const LIB_XLSX = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app'), barEl = $('#bar');
const loadScript = (src) => new Promise((res, rej) => {
  if ([...document.scripts].some((s) => s.src === src)) return res();
  const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Không tải được thư viện: ' + src)); document.head.appendChild(s);
});
const fmtN = (x, d = 2) => (Math.round(x * 10 ** d) / 10 ** d).toString().replace('.', ',');
const pad2 = (n) => String(n).padStart(2, '0');
const fmtTime = (d) => `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const normCode = (s) => String(s || '').trim().toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9_-]/g, '');

/* ---------------------------------------------------------------------
   1. PHÂN TÍCH FILE WORD / EXCEL  (hàm thuần – kiểm thử được)
   --------------------------------------------------------------------- */
const TF_YES = /^(đ|đúng|d|true|t|1|x)$/i, TF_NO = /^(s|sai|false|f|0)$/i;
const htmlToText = (h) => { const d = document.createElement('div'); d.innerHTML = h; return (d.textContent || '').replace(/\u00a0/g, ' ').trim(); };

/** HTML (từ mammoth) → mảng đoạn {text, html, table?:[[cell]]} theo đúng thứ tự trong file. */
function htmlToBlocks(html) {
  const root = document.createElement('div'); root.innerHTML = html; const out = [];
  [...root.children].forEach((el) => {
    const tag = el.tagName.toLowerCase();
    if (tag === 'table') {
      const rows = [...el.querySelectorAll('tr')].map((tr) => [...tr.children].map((c) => (c.textContent || '').replace(/\u00a0/g, ' ').trim()));
      out.push({ text: '', html: el.outerHTML, table: rows });
    } else if (tag === 'ul' || tag === 'ol') {
      [...el.querySelectorAll('li')].forEach((li) => out.push({ text: (li.textContent || '').trim(), html: li.innerHTML }));
    } else out.push({ text: (el.textContent || '').replace(/\u00a0/g, ' ').trim(), html: el.innerHTML });
  });
  return out.filter((b) => b.text || b.table || /<img/i.test(b.html));
}

/** Tách một dòng chứa nhiều phương án liên tiếp ("A. x   B. y   C. z   D. w") bắt đầu từ chữ cái `from`. */
function splitOptions(text, from, re, order) {
  const hits = []; let want = from, m; const rx = new RegExp(re, 'g');
  while ((m = rx.exec(text))) { if (m[1] === order[want]) { hits.push({ at: m.index + (m[0].length - m[0].trimStart().length), end: m.index + m[0].length, L: m[1] }); want++; } }
  if (!hits.length || hits[0].at > 0) return null;
  return hits.map((h, i) => ({ L: h.L, text: text.slice(h.end, i + 1 < hits.length ? hits[i + 1].at : undefined).trim() }));
}

/** Đọc file câu hỏi → {questions, ctxs, warnings}. Mỗi câu: {n,type,q,opts?,sub?,ctx?} */
function parseQuestions(blocks) {
  const qs = [], ctxs = [], warn = []; let cur = null, last = null, ctx = null, skippedHead = 0;
  const startRe = /^Câu\s*(\d+)\s*[.:)]?\s*/i;
  const stripLead = (h) => h.replace(/^((?:\s|<[^>]+>)*)Câu\s*\d+\s*[.:)]?\s*/i, '$1');
  const stripOpt = (h, re) => h.replace(new RegExp('^((?:\\s|<[^>]+>)*)' + re), '$1');
  const ctxRe = /^(Dữ liệu|Dùng dữ liệu|Sử dụng dữ liệu|Đọc (đoạn|thông tin|bài)|Thông tin|Đề bài|Dựa vào)[^:]{0,40}\bCâu\s*(\d+)/i;
  const O = 'ABCD', SO = 'abcd';
  for (const b of blocks) {
    const t = b.text;
    if (b.table) {
      const r0 = b.table[0] || [], c0 = String(r0[0] || '').trim().toLowerCase(), c1 = String(r0[1] || '').trim();
      if (c0 === 'điểm' || (c0 === 'câu' && /^\d/.test(c1))) continue;            // bảng điểm / phiếu trả lời trên đề
      const rows = b.table.filter((r) => /^[a-d]$/.test(String(r[0] || '').trim()) && String(r[1] || '').trim());
      if (cur && rows.length >= 2 && cur.sub.length === 0) { rows.forEach((r) => { cur.sub.push({ L: String(r[0]).trim(), html: esc(String(r[1]).trim()) }); }); last = cur.sub[cur.sub.length - 1]; continue; }
      if (ctx && !cur) ctx.html += b.html; else if (cur) cur.q += b.html;
      continue;
    }
    if (/^(-+\s*)?(HẾT|---\s*HẾT)\b/i.test(t)) { cur = null; ctx = null; continue; }
    if (/^(PHẦN\s+)?[IVX]+\s*[.):]\s+\S/.test(t) && !startRe.test(t) && t.length < 140) { ctx = null; continue; }      // tiêu đề phần
    if (/^PHẦN\s+\d/i.test(t)) continue;
    const mc = t.match(ctxRe);
    if (mc && !startRe.test(t)) {
      const head = t.split(':')[0]; const nums = new Set(); const rg = head.match(/(\d+)\s*(?:-|–|đến|->)\s*(\d+)/);
      if (rg) for (let k = +rg[1]; k <= +rg[2]; k++) nums.add(k); (head.match(/\d+/g) || []).forEach((x) => nums.add(+x));
      ctx = { id: 'c' + (ctxs.length + 1), nums: [...nums], html: '<p>' + b.html + '</p>' }; ctxs.push(ctx); cur = null; last = null; continue;
    }
    const ms = t.match(startRe);
    if (ms) {
      cur = { n: +ms[1], type: 'short', q: stripLead(b.html).trim(), opts: [], sub: [] }; qs.push(cur); last = cur;
      if (ctx && ctx.nums.includes(cur.n)) cur.ctx = ctx.id;
      continue;
    }
    if (!cur) {
      if (ctx) { ctx.html += '<p>' + b.html + '</p>'; continue; }
      if (t || /<img/i.test(b.html)) skippedHead++; continue;
    }
    if (/^[A-D]\s*[.)]/.test(t) && cur.opts.length < 4) {
      const segs = splitOptions(t, cur.opts.length, '(?:^|\\s)([A-D])\\s*[.)]\\s*', O);
      if (segs) {
        if (segs.length === 1) { const o = { L: segs[0].L, html: stripOpt(b.html, segs[0].L + '\\s*[.)]\\s*') }; cur.opts.push(o); last = o; }
        else segs.forEach((g) => { const o = { L: g.L, html: esc(g.text) }; cur.opts.push(o); last = o; });
        continue;
      }
    }
    if (/^[a-d]\s*\)/.test(t) && cur.sub.length < 4) {
      const segs = splitOptions(t, cur.sub.length, '(?:^|\\s)([a-d])\\s*\\)\\s*', SO);
      if (segs) {
        if (segs.length === 1) { const o = { L: segs[0].L, html: stripOpt(b.html, segs[0].L + '\\s*\\)\\s*') }; cur.sub.push(o); last = o; }
        else segs.forEach((g) => { const o = { L: g.L, html: esc(g.text) }; cur.sub.push(o); last = o; });
        continue;
      }
    }
    if (last === cur || !last) cur.q += '<p>' + b.html + '</p>'; else if (last && (cur.opts.includes(last) || cur.sub.includes(last))) { if (t) last.html += '<br>' + b.html; else last.html += b.html; } else cur.q += '<p>' + b.html + '</p>';
  }
  if (skippedHead) warn.push(`Bỏ qua ${skippedHead} đoạn đầu đề trước “Câu 1” (tên trường, họ tên…).`);
  qs.forEach((q) => {
    if (q.opts.length >= 2) { q.type = 'mcq'; if (q.opts.length !== 4) warn.push(`Câu ${q.n}: có ${q.opts.length} phương án (chuẩn là 4).`); }
    else if (q.sub.length >= 2) { q.type = 'tf'; if (q.sub.length !== 4) warn.push(`Câu ${q.n}: có ${q.sub.length} ý đúng/sai (chuẩn là 4).`); }
    if (!q.q.replace(/<[^>]+>/g, '').trim() && !/<img/i.test(q.q)) warn.push(`Câu ${q.n}: không có nội dung câu hỏi.`);
  });
  const seen = new Set(); qs.forEach((q) => { if (seen.has(q.n)) warn.push(`Số câu bị trùng: Câu ${q.n}.`); seen.add(q.n); });
  return { questions: qs, ctxs: ctxs.filter((c) => qs.some((q) => q.ctx === c.id)), warnings: warn };
}

/** Đọc đáp án từ các dòng văn bản/bảng → mảng {n, cells:[], why, tol}. */
function parseKeyLines(blocks) {
  const out = []; let lastEntry = null;
  const whyRe = /^(giải thích|lời giải|hướng dẫn|gợi ý)\s*[:：]\s*(.*)$/i;
  for (const b of blocks) {
    if (b.table) {
      const h0 = b.table[0] || [], h1 = b.table[1] || [];
      if (b.table.length >= 2 && /^câu$/i.test(String(h0[0]).trim()) && /^(đáp án|đáp số|kết quả)/i.test(String(h1[0]).trim()) && /^\d+[a-d]?$/i.test(String(h0[1]).trim())) {
        const g = new Map();      // bảng ngang: Câu | 1 | 2 | … | 17a | 17b …  /  Đáp án | A | B | …
        for (let i = 1; i < h0.length; i++) { const m = String(h0[i]).trim().match(/^(\d+)([a-d])?$/i); if (!m) continue; const n = +m[1]; if (!g.has(n)) { const e = { n, cells: [] }; g.set(n, e); out.push(e); lastEntry = e; } g.get(n).cells.push(String(h1[i] ?? '').trim()); }
        continue;
      }
      let cols = null;
      for (const row of b.table) {
        const low = row.map((c) => c.toLowerCase());
        if (low.some((c) => /^(đáp án|đáp số|kết quả)/.test(c)) && !/^\d/.test(row[0])) { cols = low; continue; }
        const e = rowToEntry(row, cols); if (!e) continue;
        if (e.subLetter) { const p = out.find((x) => x.n === e.n); if (p) { p.cells.push(...e.cells); continue; } }
        out.push(e); lastEntry = e;
      }
      continue;
    }
    const t = b.text; if (!t) continue;
    const w = t.match(whyRe); if (w && lastEntry) { lastEntry.why = w[2]; continue; }
    // dạng gọn trên một dòng: "1.A 2.B 3.C ..." hoặc "1-A  2-B"
    const compact = [...t.matchAll(/(?:^|[\s,;])(\d{1,3})\s*[.):\-–]\s*([A-D])(?=$|[\s,;.])/g)];
    if (compact.length >= 2) { compact.forEach((m) => { const e = { n: +m[1], cells: [m[2]] }; out.push(e); lastEntry = e; }); continue; }
    const m = t.match(/^(?:Câu\s*)?(\d{1,3})\s*[.:)\-–]?\s*(.*)$/i);
    if (m && m[2] !== '') { const e = { n: +m[1], cells: [m[2]] }; out.push(e); lastEntry = e; }
    else if (lastEntry && /^(giải|vì|do)\b/i.test(t)) lastEntry.why = (lastEntry.why ? lastEntry.why + ' ' : '') + t;
  }
  return out;
}
function rowToEntry(row, cols) {
  const first = String(row[0] ?? '').trim(); const mm = first.match(/^(?:Câu\s*)?(\d{1,3})([a-d])?\b/i); if (!mm) return null;
  const e = { n: +mm[1], cells: [] }; if (mm[2]) e.subLetter = mm[2];
  const idx = (re) => cols ? cols.findIndex((c) => re.test(c)) : -1;
  const ia = idx(/^(đáp án|đáp số|kết quả)/), iw = idx(/(giải thích|lời giải|hướng dẫn|gợi ý)/), it = idx(/(sai số|dung sai)/);
  const cell = (i) => String(row[i] ?? '').trim();
  if (ia >= 0) {
    e.cells.push(cell(ia));
    for (let i = ia + 1; i < ia + 4 && i < row.length && (TF_YES.test(cell(ia)) || TF_NO.test(cell(ia))); i++) { if (TF_YES.test(cell(i)) || TF_NO.test(cell(i))) e.cells.push(cell(i)); else break; }
  } else {
    let i = 1; e.cells.push(cell(1)); i = 2;
    while (i < 5 && i < row.length && (TF_YES.test(cell(i)) || TF_NO.test(cell(i))) && (TF_YES.test(cell(1)) || TF_NO.test(cell(1)))) { e.cells.push(cell(i)); i++; }
    const rest = row.slice(i).map((c) => String(c ?? '').trim()).filter(Boolean); if (rest[0]) e.why = rest[0];
  }
  const inRun = (i) => ia >= 0 && i > ia && i < ia + e.cells.length; // các ô Đ/S nằm đè lên cột giải thích/sai số
  if (iw >= 0 && !inRun(iw) && cell(iw)) e.why = cell(iw);
  if (it >= 0 && !inRun(it) && cell(it)) e.tolRaw = cell(it);
  return e;
}

const parseNum = (s) => { const x = String(s ?? '').trim().replace(/\s+/g, '').replace(',', '.'); if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(x)) return NaN; return parseFloat(x); };

/** Gắn đáp án vào câu hỏi theo số câu; kiểm tra định dạng. */
function attachKey(questions, entries) {
  const warn = [], byN = new Map(); entries.forEach((e) => { if (byN.has(e.n)) warn.push(`Đáp án Câu ${e.n} xuất hiện nhiều lần – dùng bản đầu tiên.`); else byN.set(e.n, e); });
  const qn = new Set(questions.map((q) => q.n)); byN.forEach((e, n) => { if (!qn.has(n)) warn.push(`Có đáp án cho Câu ${n} nhưng đề không có câu này.`); });
  let ok = 0;
  for (const q of questions) {
    const e = byN.get(q.n); delete q.ans; delete q.why; delete q.tol;
    if (!e) { warn.push(`Câu ${q.n}: chưa có đáp án.`); continue; }
    const joined = e.cells.join(' ').trim(); if (e.why) q.why = e.why;
    if (q.type === 'mcq') {
      const m = joined.match(/\b([A-D])\b/i) || joined.match(/^([A-D])/i);
      if (!m) { warn.push(`Câu ${q.n} (trắc nghiệm): đáp án “${joined}” không phải A, B, C hoặc D.`); continue; }
      q.ans = m[1].toUpperCase(); ok++;
    } else if (q.type === 'tf') {
      let toks = joined.match(/đúng|sai|true|false|[đĐsSdDtTfF01]/gi) || [];
      if (!toks.length) toks = [];
      // dạng "a-Đ b-S": bỏ chữ cái a-d đứng trước dấu - hoặc )
      const cleaned = joined.replace(/\b[a-d]\s*[-–)=:]\s*/gi, ' ');
      toks = cleaned.match(/đúng|sai|true|false|[đĐsStTfFdD01]/gi) || [];
      const vals = toks.map((t) => (TF_YES.test(t) ? 1 : TF_NO.test(t) ? 0 : null));
      if (vals.length !== q.sub.length || vals.includes(null)) { warn.push(`Câu ${q.n} (đúng/sai): cần ${q.sub.length} giá trị Đ/S, đọc được “${joined}”.`); continue; }
      q.ans = vals.join(''); ok++;
    } else {
      const parts = joined.split(/\s*(?:;|\bhoặc\b|\|)\s*/i).map((s) => s.trim()).filter(Boolean);
      let tol = null; const main = [];
      for (let p of parts) { const pm = p.match(/^(.*?)\s*(?:±|\+\/-)\s*([\d.,]+)\s*\)?$/); if (pm) { main.push(pm[1].replace(/[()]/g, '')); tol = parseNum(pm[2]); } else main.push(p); }
      if (e.tolRaw) { const t = parseNum(e.tolRaw.replace('±', '')); if (!isNaN(t)) tol = t; }
      if (!main.length) { warn.push(`Câu ${q.n} (trả lời ngắn): đáp án trống.`); continue; }
      q.ans = main.join(';'); if (tol != null && !isNaN(tol)) q.tol = tol; ok++;
      if (main.every((x) => isNaN(parseNum(x)))) warn.push(`Câu ${q.n}: đáp án “${q.ans}” không phải số – sẽ so khớp chữ (không phân biệt hoa/thường).`);
    }
  }
  return { warnings: warn, ok };
}

/* ---------------------------------------------------------------------
   2. CHẤM ĐIỂM
   --------------------------------------------------------------------- */
const TF_TABLE = [0, 0.1, 0.25, 0.5, 1]; // 0,1,2,3,4 ý đúng (thang điểm đề minh họa của Bộ GD&ĐT)
function gradeQuestion(q, a) {
  if (q.type === 'mcq') { const r = a === q.ans; return { got: r ? 1 : 0, state: r ? 'ok' : 'bad' }; }
  if (q.type === 'tf') {
    const key = q.ans || '', mine = a || ''; let c = 0; for (let i = 0; i < key.length; i++) if (mine[i] === key[i]) c++;
    const n = key.length, got = n === 4 ? TF_TABLE[c] : (n ? c / n : 0);
    return { got, c, n, state: c === n ? 'ok' : c === 0 ? 'bad' : 'part' };
  }
  const mine = String(a ?? '').trim(); if (!mine) return { got: 0, state: 'bad' };
  const accepted = String(q.ans || '').split(';'); const v = parseNum(mine);
  let r = false;
  for (const x of accepted) {
    const k = parseNum(x);
    if (!isNaN(k) && !isNaN(v)) { if (Math.abs(v - k) <= Math.max(q.tol || 0, 1e-9 * Math.max(1, Math.abs(k)))) r = true; }
    else if (isNaN(k) && x.trim().toLowerCase() === mine.toLowerCase()) r = true;
  }
  return { got: r ? 1 : 0, state: r ? 'ok' : 'bad' };
}
function gradeAll(questions, answers) {
  let sum = 0, correct = 0; const per = {};
  for (const q of questions) { const g = gradeQuestion(q, answers[q.n]); per[q.n] = g; sum += g.got; if (g.state === 'ok') correct++; }
  return { score: questions.length ? Math.round((sum / questions.length) * 1000) / 100 : 0, correct, total: questions.length, per };
}

const dbMsg = (e) => {

  $('#sub').onclick = () => {
    const left = t.questions.length - t.questions.filter(answered).length;
    if (left > 0 && !armed) { armed = true; const n = $('#subnote'); n.style.display = 'block'; n.textContent = `Bạn còn ${left} câu chưa trả lời. Bấm “Nộp bài” lần nữa để xác nhận nộp.`; return; }
    finish(false);
  };
  if (t.minutes) {
    const end = started + t.minutes * 60000; const tick = () => { const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)); const tm = $('#tm'); if (tm) { tm.textContent = `${pad2(Math.floor(left / 60))}:${pad2(left % 60)}`; tm.classList.toggle('low', left <= 60); } if (left <= 0) finish(true); };
    tick(); timerId = setInterval(tick, 500);
  } else $('#tm').textContent = 'Không giới hạn thời gian';
}

function viewResult(t, who, ans, g, optOrder, order, dur, saved, err, auto) {
  window.scrollTo(0, 0); document.title = 'Kết quả – ' + t.title;
  const st = { ok: '✔ Đúng', bad: '✖ Sai', part: '◐ Đúng một phần' };
  const items = order.map((q, idx) => {
    const r = g.per[q.n]; let body = '';
    if (q.type === 'mcq') {
      body = optOrder[q.n].map((oi, pos) => { const L = q.opts[oi].L, cls = L === q.ans ? 'right' : (L === ans[q.n] ? 'wrong' : ''); return `<div class="opt ${cls}"><span><b>${'ABCD'[pos]}.</b> ${q.opts[oi].html}${L === q.ans ? ' &nbsp;<b>✔ đáp án đúng</b>' : L === ans[q.n] ? ' &nbsp;<b>← bạn chọn</b>' : ''}</span></div>`; }).join('');
    } else if (q.type === 'tf') {
      body = q.sub.map((s, i) => { const mine = (ans[q.n] || '')[i], key = q.ans[i], ok = mine === key; return `<div class="subrow"><div><b>${'abcd'[i]})</b> ${s.html}</div><div><b class="${ok ? '' : 'err'}">${mine === '1' ? 'Đúng' : mine === '0' ? 'Sai' : 'Bỏ trống'}</b> · đáp án: <b>${key === '1' ? 'Đúng' : 'Sai'}</b> ${ok ? '✔' : '✖'}</div></div>`; }).join('');
      body += `<div class="muted">Đúng ${r.c}/${r.n} ý → ${fmtN(r.got)} / 1 điểm của câu.</div>`;
    } else body = `<div class="muted">Bạn trả lời: <b>${esc(ans[q.n] || 'bỏ trống')}</b> · Đáp án: <b>${esc(String(q.ans).replace(/;/g, ' hoặc '))}</b>${q.tol ? ' (sai số cho phép ± ' + fmtN(q.tol, 4) + ')' : ''}</div>`;
    const cx2 = q.ctx && (t.ctxs || []).find((c) => c.id === q.ctx); const showCx2 = cx2 && !(order[idx - 1] && order[idx - 1].ctx === q.ctx);
    return `<div class="qcard ${r.state}">${showCx2 ? `<div class="why qtext" style="margin:0 0 10px">${cx2.html}</div>` : ''}<div class="qhead">Câu ${idx + 1} – ${st[r.state]}</div><div class="qtext">${q.q}</div>${body}${q.why ? `<div class="why"><b>Giải thích:</b> ${esc(q.why)}</div>` : ''}</div>`;
  }).join('');
  const m = Math.floor(dur / 60), s = dur % 60;
  app.innerHTML = `
    <h1>Kết quả bài làm</h1>
    <div class="card"><div class="muted">${esc(who.name)} – lớp ${esc(who.cls)} · ${esc(t.title)}</div>
      <div class="score">${fmtN(g.score)} <span style="font-size:20px;font-weight:600">/ 10 điểm</span></div>
      <p>Đúng hoàn toàn <b>${g.correct}</b> / ${g.total} câu · thời gian làm bài ${m} phút ${s} giây${auto ? ' (hết giờ, hệ thống tự nộp)' : ''}.</p>
      ${saved ? '<div class="msg ok">Bài làm đã được gửi cho giáo viên.</div>' : `<div class="msg bad">Không gửi được bài làm cho giáo viên (${esc(err)}). Hãy chụp màn hình kết quả này và báo giáo viên.</div>`}
      <div class="row"><button class="primary" onclick="location.hash='';location.reload()">Về trang đầu</button><button onclick="window.print()">In / lưu PDF</button></div></div>
    <h2 style="margin-top:20px">Xem lại từng câu</h2>${items}`;
}

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() { return request.auth != null; }
    function adminDoc() { return /databases/$(db)/documents/meta/admin; }
    function userDoc(u) { return /databases/$(db)/documents/users/$(u); }
    function isAdmin() {
      return signedIn() && (
        (exists(adminDoc()) && get(adminDoc()).data.uid == request.auth.uid) ||
        (exists(userDoc(request.auth.uid)) && get(userDoc(request.auth.uid)).data.role == 'admin'));
    }
    function active() {
      return signedIn() && !(exists(userDoc(request.auth.uid)) && get(userDoc(request.auth.uid)).data.disabled == true);
    }
    match /meta/admin {
      allow read: if signedIn();
      allow create: if signedIn() && request.resource.data.uid == request.auth.uid;
    }
    match /users/{uid} {
      allow read: if signedIn() && (request.auth.uid == uid || isAdmin());
      allow create: if signedIn() && request.auth.uid == uid && request.resource.data.disabled == false &&
        (request.resource.data.role == 'user' ||
         (exists(adminDoc()) && get(adminDoc()).data.uid == request.auth.uid));
      allow update, delete: if isAdmin();
    }
    match /schools/{id} {
      allow read: if true;
      allow write: if active();
    }
    // ---- Kiểm tra trực tuyến ----
    match /tests/{code} {
      allow get: if true;
      allow list, create, update, delete: if isAdmin();
      match /results/{rid} {
        allow create: if request.resource.data.name is string && request.resource.data.name.size() <= 80
                      && request.resource.data.cls is string && request.resource.data.cls.size() <= 20
                      && request.resource.data.score is number && request.resource.data.score >= 0 && request.resource.data.score <= 10
                      && request.resource.data.at == request.time;
        allow read, delete: if isAdmin();
      }
    }
  }
}
`;

function showPreview(pv, test, noKey, warnings) {
  const missing = noKey ? 0 : test.questions.filter((q) => q.ans === undefined).length, size = new Blob([JSON.stringify(test)]).size;
  const cnt = { mcq: 0, tf: 0, short: 0 }; test.questions.forEach((q) => cnt[q.type]++);
  const tn = { mcq: 'Trắc nghiệm', tf: 'Đúng/Sai', short: 'Trả lời ngắn' };
  const ansTxt = (q) => q.ans === undefined ? (noKey ? '<span class="warn">chưa có (bổ sung sau)</span>' : '<span class="err">chưa có</span>') : q.type === 'tf' ? q.ans.split('').map((c) => c === '1' ? 'Đ' : 'S').join(' ') : esc(String(q.ans).replace(/;/g, ' hoặc ')) + (q.tol ? ' (± ' + q.tol + ')' : '');
  const problems = [];
  if (!test.title) problems.push('Chưa nhập tên bài kiểm tra.'); if (!test.code) problems.push('Mã đề chỉ gồm chữ không dấu, số, dấu - hoặc _.');
  if (missing) problems.push(`${missing} câu chưa có đáp án hợp lệ.`); if (size > 950000) problems.push(`Đề quá lớn (${Math.round(size / 1024)} KB). Hãy giảm kích thước hình ảnh (giới hạn khoảng 900 KB).`);
  pv.innerHTML = `
    <h3>Kết quả đọc file</h3>
    <div class="msg ${problems.length ? 'bad' : 'ok'}">${noKey ? 'Chưa chọn file đáp án: đề sẽ được lưu ở trạng thái <b>chờ đáp án</b> (học sinh chưa làm được cho đến khi bạn bổ sung đáp án). ' : ''}${test.questions.length} câu: ${cnt.mcq} trắc nghiệm · ${cnt.tf} đúng/sai · ${cnt.short} trả lời ngắn. Dung lượng ${Math.round(size / 1024)} KB.${problems.length ? '<br>' + problems.map(esc).join('<br>') : ''}</div>
    ${warnings.length ? `<details ${problems.length ? 'open' : ''}><summary class="warn">${warnings.length} cảnh báo</summary><ul>${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></details>` : ''}
    <details open><summary>Xem lại từng câu và đáp án đã đọc</summary><div class="scroll" style="padding:0 12px">${test.questions.map((q) => `<div class="prev-q"><b>Câu ${q.n}</b> <span class="tag">${tn[q.type]}</span> <b>Đáp án: ${ansTxt(q)}</b>
      <div class="qtext">${q.q}</div>${q.type === 'mcq' ? q.opts.map((o) => `<div>${o.L}. ${o.html}</div>`).join('') : ''}${q.type === 'tf' ? q.sub.map((o) => `<div>${o.L}) ${o.html}</div>`).join('') : ''}${q.why ? `<div class="muted">Giải thích: ${esc(q.why)}</div>` : ''}</div>`).join('')}</div></details>
    <div class="row" style="margin-top:12px"><button class="primary" id="pub" ${problems.length ? 'disabled' : ''}>${noKey ? 'Lưu đề (chờ đáp án)' : 'Đăng đề'}</button><span class="muted">Học sinh sẽ vào bằng mã <b>${esc(test.code)}</b>.</span></div><div id="pubmsg"></div>`;
  $('#pub').onclick = async () => {
    const pm = $('#pubmsg'), btn = $('#pub'); btn.disabled = true; pm.innerHTML = '';
    try {
      const db = await DB.init(true); const get = db.getTest ? db.getTest.bind(db) : DB.getTest.bind(DB);
      const ex = await get(test.code);
      if (ex && !btn.dataset.ok) { btn.dataset.ok = '1'; btn.disabled = false; btn.textContent = 'Mã đã tồn tại – bấm để ghi đè'; pm.innerHTML = `<div class="msg bad">Đã có đề mã ${esc(test.code)} (“${esc(ex.title)}”). Bấm lần nữa để ghi đè, hoặc đổi mã đề.</div>`; return; }
      const doc = { ...test, open: !noKey, noKey: !!noKey, createdMs: Date.now(), owner: DB.user ? DB.user.uid : '' };
      await (db.saveTest ? db.saveTest(doc) : DB.saveTest(doc));
      pm.innerHTML = noKey ? `<div class="msg ok">Đã lưu đề mã <b>${esc(test.code)}</b>. Khi có đáp án, vào thẻ “Đề đã đăng &amp; kết quả” → “Bổ sung đáp án”.</div>` : `<div class="msg ok">Đã đăng đề. Gửi học sinh liên kết sau (hoặc chỉ cần mã đề):<br><b id="lk">${esc(shareUrl(test.code))}</b> <button class="small" id="cp">Sao chép</button></div>`;
      if ($('#cp')) $('#cp').onclick = () => navigator.clipboard.writeText(shareUrl(test.code)).then(() => { $('#cp').textContent = 'Đã chép ✔'; });
      draft = null; btn.textContent = 'Đã đăng';
    } catch (e) { btn.disabled = false; pm.innerHTML = `<div class="msg bad">${esc(dbMsg(e))}</div>`; }
  };
}

async function tabList(el) {
  el.innerHTML = '<p class="muted">Đang tải…</p>';
  try {
    const db = await DB.init(true); const tests = await (db.listTests ? db.listTests() : DB.listTests());
    if (!tests.length) { el.innerHTML = '<div class="card">Chưa có đề nào. Hãy tạo đề ở thẻ “Tạo đề mới”.</div>'; return; }
    el.innerHTML = tests.map((t) => `<div class="card" data-code="${esc(t.code)}"><div class="row" style="justify-content:space-between"><div><b>${esc(t.title)}</b><div class="muted">Mã <b>${esc(t.code)}</b> · ${t.questions.length} câu · ${t.minutes ? t.minutes + ' phút' : 'không giới hạn'} · ${t.createdMs ? fmtTime(new Date(t.createdMs)) : ''}</div></div><span class="tag ${t.noKey ? '' : t.open === false ? '' : 'ready'}">${t.noKey ? 'Chờ đáp án' : t.open === false ? 'Đã đóng' : 'Đang mở'}</span></div>
      <div class="row" style="margin-top:8px">${t.noKey ? '<button class="small primary" data-a="key">Bổ sung đáp án</button>' : '<button class="small" data-a="res">Xem kết quả</button><button class="small" data-a="tog">' + (t.open === false ? 'Mở lại' : 'Đóng đề') + '</button>'}<button class="small" data-a="lnk">Sao chép liên kết</button><button class="small" data-a="del">Xóa đề</button></div><div class="out"></div></div>`).join('');
    el.querySelectorAll('.card').forEach((card) => {
      const code = card.dataset.code, t = tests.find((x) => x.code === code), out = card.querySelector('.out');
      card.querySelectorAll('button').forEach((b) => b.onclick = async () => {
        try {
          if (b.dataset.a === 'lnk') { await navigator.clipboard.writeText(shareUrl(code)); b.textContent = 'Đã chép ✔'; }
          else if (b.dataset.a === 'tog') { await (db.setOpen ? db.setOpen(code, t.open === false) : DB.setOpen(code, t.open === false)); tabList(el); }
          else if (b.dataset.a === 'del') { if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Bấm lần nữa để xóa (kèm toàn bộ kết quả)'; return; } await (db.deleteTest ? db.deleteTest(code) : DB.deleteTest(code)); tabList(el); }
          else if (b.dataset.a === 'res') showResults(out, t, db);
          else if (b.dataset.a === 'key') {
            out.innerHTML = '<div class="field"><label>Chọn file đáp án (Word hoặc Excel)</label><input type="file" accept=".docx,.xlsx,.xls,.csv"></div><div class="kmsg"></div>';
            out.querySelector('input').onchange = async (ev) => {
              const km = out.querySelector('.kmsg'); km.innerHTML = '<div class="msg info">Đang đọc…</div>';
              try {
                const K = attachKey(t.questions, await readKeyFile(ev.target.files[0])); const miss = t.questions.filter((q) => q.ans === undefined).length;
                if (miss) { km.innerHTML = `<div class="msg bad">Còn ${miss} câu chưa có đáp án hợp lệ:<ul>${K.warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>`; return; }
                t.noKey = false; t.open = true; await (db.saveTest ? db.saveTest(t) : DB.saveTest(t));
                km.innerHTML = `<div class="msg ok">Đã lưu đáp án (${K.ok} câu) và mở đề. Mã đề: <b>${esc(t.code)}</b>.${K.warnings.length ? '<br>Cảnh báo: ' + K.warnings.map(esc).join('; ') : ''}</div>`; setTimeout(() => tabList(el), 1500);
              } catch (e) { km.innerHTML = `<div class="msg bad">${esc(dbMsg(e))}</div>`; }
            };
          }
        } catch (e) { out.innerHTML = `<div class="msg bad">${esc(dbMsg(e))}</div>`; }
      });
    });
  } catch (e) { el.innerHTML = `<div class="msg bad">${esc(dbMsg(e))}</div>`; }
}

async function showResults(out, t, db) {
  out.innerHTML = '<p class="muted">Đang tải kết quả…</p>';
  const rs = await (db.listResults ? db.listResults(t.code) : DB.listResults(t.code));
  if (!rs.length) { out.innerHTML = '<div class="msg info">Chưa có học sinh nào nộp bài.</div>'; return; }
  const avg = rs.reduce((s, r) => s + r.score, 0) / rs.length;
  const mm = (r) => `${Math.floor(r.durationSec / 60)}′${pad2(r.durationSec % 60)}″`;
  const bins = [0, 0, 0, 0]; rs.forEach((r) => { bins[r.score >= 8 ? 0 : r.score >= 6.5 ? 1 : r.score >= 5 ? 2 : 3]++; });
  // tỉ lệ đúng theo câu
  const stat = t.questions.map((q) => { let sum = 0; rs.forEach((r) => { sum += gradeQuestion(q, (r.ans || {})[q.n]).got; }); return { n: q.n, p: sum / rs.length }; });
  out.innerHTML = `<div class="msg info">${rs.length} bài nộp · điểm trung bình <b>${fmtN(avg)}</b> · Giỏi (≥8): ${bins[0]} · Khá (6,5–7,9): ${bins[1]} · Trung bình (5–6,4): ${bins[2]} · Dưới 5: ${bins[3]}</div>
    <div class="row"><button class="small" id="ex">Xuất Excel</button></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Họ và tên</th><th>Lớp</th><th class="num">Điểm</th><th class="num">Câu đúng</th><th>Thời gian</th><th>Nộp lúc</th></tr></thead><tbody>
    ${rs.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.cls)}</td><td class="num"><b>${fmtN(r.score)}</b></td><td class="num">${r.correct}/${r.total}</td><td>${mm(r)}</td><td>${r.atMs ? fmtTime(new Date(r.atMs)) : ''}</td></tr>`).join('')}</tbody></table></div>
    <h3>Tỉ lệ làm đúng theo câu (câu nào nhiều học sinh sai cần ôn lại)</h3>
    <div class="scroll"><table class="tbl"><thead><tr><th>Câu</th><th class="num">Tỉ lệ đúng</th></tr></thead><tbody>${stat.map((s) => `<tr><td>Câu ${s.n}</td><td class="num">${Math.round(s.p * 100)}%</td></tr>`).join('')}</tbody></table></div>`;
  $('#ex', out).onclick = async () => {
    await loadScript(LIB_XLSX);
    const rows = [['STT', 'Họ và tên', 'Lớp', 'Điểm', 'Số câu đúng', 'Tổng số câu', 'Thời gian (giây)', 'Nộp lúc']].concat(rs.map((r, i) => [i + 1, r.name, r.cls, r.score, r.correct, r.total, r.durationSec, r.atMs ? fmtTime(new Date(r.atMs)) : '']));
    const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{ wch: 5 }, { wch: 26 }, { wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 16 }, { wch: 18 }];
    XLSX.utils.book_append_sheet(wb, ws, 'KetQua'); XLSX.writeFile(wb, `ket-qua-${t.code}.xlsx`);
  };
}

/* ---------------------------------------------------------------------
   7. ĐỊNH TUYẾN
   --------------------------------------------------------------------- */
async function route() {
  const h = location.hash.replace(/^#/, '');
  if (h === 'gv') return viewTeacher();
  const m = h.match(/^thi\/(.+)$/);
  viewEnter(m ? { code: normCode(decodeURIComponent(m[1])) } : {});
}
window.addEventListener('hashchange', route);
window.KT = { parseQuestions, parseKeyLines, attachKey, gradeQuestion, gradeAll, htmlToBlocks, makeDocx, route };
route();
</script>
